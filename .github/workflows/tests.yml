name: Тесты

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Тесты
        # Тесты не ходят в сеть: транспорт всюду подменяется. Значит прогон
        # ничего не стоит, ничего не пишет в боевые таблицы и не зависит от
        # доступности внешних сервисов.
        run: pytest -q
      - name: Проверка стиля
        run: ruff check mpcore tests

  gas:
    # Половина ядра для таблиц — на другом языке, но правила в ней те же,
    # и расходиться им нельзя. Проверяется тем же прогоном, что и питон.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Тесты Apps Script-ядра
        run: node gas/test_mpcore.js
